name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The extension depends on a sibling checkout of the language repository
      # while Core's shape is still settling. A published dependency replaces this
      # once the sandbox stops demanding changes to Core.
      - uses: actions/checkout@v4
        with:
          repository: KaiSevelin/7k
          path: 7K
      - uses: actions/checkout@v4
        with:
          path: 7k-vscode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: 7K
      # The extension resolves Core through `types`, so Core has to be built. The
      # sandbox reads Core's TypeScript source directly and needs no such step; the
      # difference is that a VS Code extension is loaded as CommonJS.
      - run: npm run build
        working-directory: 7K
      - run: npm install
        working-directory: 7k-vscode
      - run: npm run typecheck
        working-directory: 7k-vscode
      - run: npm test
        working-directory: 7k-vscode
